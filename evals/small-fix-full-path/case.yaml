schema_version: '1.0'
name: Small fix gets the full path
description: 'Scenario 4: even a one-line copy fix runs every lifecycle stage, with design/design-review
  proposed not-applicable.'
tags:
- lifecycle
context:
  scaffold_script: scaffold.sh
execution:
  prompt: The footer says 2024, should be 2026.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: llm
  name: meets-scenario-pass-criteria
  criteria: 'PASS only if the response opens an initiative and, over the course of the turn,
    treats every one of the 15 initiative stages as required: it writes (or describes writing)
    a spec that is short but still has all eleven required sections, and it proposes design
    and design-review as not-applicable with stated evidence (for example: no visual surface
    changes), explicitly waiting for the owner''s confirmation of that not-applicable status
    rather than silently skipping them. FAIL if design or design-review is skipped without
    being proposed not-applicable and put to the owner, or if the spec is missing sections.'
  focus: last_message
