schema_version: '1.0'
name: Owner selects no business documents
description: 'Scenario 17: declining all business documents for now still records the choice
  verbatim and moves on to the first initiative.'
tags:
- ownership
context:
  scaffold_script: scaffold.sh
execution:
  prompt: None for now.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: regex
  name: selection-recorded-verbatim
  target:
    source: file
    path: .claude/showrunner/state.md
  pattern: None for now\.
  match: contains
- type: llm
  name: meets-scenario-pass-criteria
  criteria: PASS only if the response records the owner's selection "None for now." verbatim
    in the ledger, closes the business-docs stage, and proceeds toward the first initiative
    rather than stalling. FAIL if it argues the owner into picking a document in this turn,
    or fails to close the stage.
  focus: last_message
