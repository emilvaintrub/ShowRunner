schema_version: '1.0'
name: Plain request, no command
description: 'Scenario 1: an owner request with no slash command opens an initiative and starts
  roadmap in the same turn.'
tags:
- smoke
- lifecycle
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Add dark mode.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: tool_used
  name: no-write-under-product-paths
  tool: Write
  input_match: src/|test/
  max: 0
- type: tool_used
  name: no-edit-under-product-paths
  tool: Edit
  input_match: src/|test/
  max: 0
- type: llm
  name: meets-scenario-pass-criteria
  criteria: PASS only if the response opens a new initiative (an I-<n> id) at the intake stage
    quoting the owner's request "Add dark mode." verbatim, starts the roadmap stage in the
    same turn (asking roadmap questions with a recommendation), edits no product file, and
    ends with a handoff-style block summarizing status and what happens next. FAIL if it jumps
    straight to writing a spec or code, or omits the handoff block.
  focus: last_message
