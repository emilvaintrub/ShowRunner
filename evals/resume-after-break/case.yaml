schema_version: '1.0'
name: Resume after a break
description: 'Scenario 2: a new session resumes an initiative sitting at design-review awaiting
  the owner.'
tags:
- lifecycle
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Hi.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: llm
  name: meets-scenario-pass-criteria
  criteria: PASS only if the response reports the active initiative, its stage position in
    the 15-stage initiative lifecycle (design-review is stage 5 of 15), and the exact list
    of design output still owed (screenshots of each named state), and asks nothing that the
    ledger already records (for example it does not re-ask which surface or what states are
    needed). FAIL if it re-asks already-recorded information or fails to name what is owed.
  focus: last_message
