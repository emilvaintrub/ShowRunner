schema_version: '1.0'
name: Copyleft dependency
description: 'Scenario 25: an AGPL dependency found at the security stage is flagged as a
  licence blocker, separate from security findings, for an owner decision.'
tags:
- evidence
- legal
context:
  scaffold_script: scaffold.sh
execution:
  prompt: We're at the security stage for the loan list - is everything clear to ship?
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: regex
  name: agpl-named
  pattern: AGPL
  match: contains
- type: llm
  name: meets-scenario-pass-criteria
  criteria: 'PASS only if the response identifies the agpl-pdf-export dependency as AGPL-3.0
    licensed, reports it as blocked without an owner decision under the configured licence
    policy (distribution: saas), explains in plain words why AGPL matters for a SaaS product,
    suggests an alternative dependency when one plausibly exists, records that the owner''s
    decision is still needed, and reports this as a licence finding kept separate from the
    security findings rather than folded into them. FAIL if it clears the dependency to ship
    without an owner decision, or reports it as an ordinary security vulnerability rather
    than a licence issue.'
  focus: last_message
