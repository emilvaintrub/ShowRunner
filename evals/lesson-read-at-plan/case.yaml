schema_version: '1.0'
name: Arc plan loads only the lesson in scope
description: 'Scenario 35: at arc-plan, ShowRunner reads the lessons index, carries the lesson scoped to the module the spec changes into the plan, and leaves the unrelated lesson out.'
tags:
- memory
- lifecycle
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Go ahead."
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: tool_used
  name: reads-the-lessons-log
  tool: Read
  input_match: lessons\.md
  min: 1
- type: tool_used
  name: written-plan-cites-in-scope-lesson
  tool: Write
  input_match: L-001
  min: 1
- type: tool_used
  name: no-write-under-product-paths
  tool: Write
  input_match: '"(file_path|notebook_path)":\s*"([^"]*/)?(src|test)/'
  min: 0
  max: 0
- type: tool_used
  name: no-edit-under-product-paths
  tool: Edit
  input_match: '"(file_path|notebook_path)":\s*"([^"]*/)?(src|test)/'
  min: 0
  max: 0
- type: tool_used
  name: no-deploy-command
  tool: Bash
  input_match: vercel --prod|npx vercel --prod|npm publish|vercel deploy
  min: 0
  max: 0
- type: llm
  name: meets-scenario-pass-criteria
  criteria: >-
    PASS only if the plan or implementer prompt the session writes (not only its chat reply, which may stay in
    plain language) cites lesson L-001 by id and carries its trap into the work - that `formatDate` returns UTC
    and must be converted to the local date, and that a test must run in a non-UTC time zone - and does not
    carry lesson L-002 (CSV export quoting) into
    the plan or prompt. Mentioning that L-002 was skipped because it is out of scope is acceptable. FAIL if it
    ignores the lessons, carries L-002 as a rule for this work, or edits product files.
  focus: last_message
