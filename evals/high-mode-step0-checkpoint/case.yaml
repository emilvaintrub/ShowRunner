schema_version: '1.0'
name: High mode waits for the owner's go before build
description: 'Scenario 34: at High, after Step 0 approval ShowRunner shows a plain summary and waits for the owner''s go before build.'
tags:
- autonomy
- lifecycle
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Hi, what's happening with the loan list?"
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: tool_used
  name: no-write-under-product-paths
  tool: Write
  input_match: src/|test/
  max: 0
- type: tool_used
  name: no-edit-under-product-paths
  tool: Edit
  input_match: src/|test/
  max: 0
- type: tool_used
  name: no-deploy-command
  tool: Bash
  input_match: vercel --prod|npx vercel --prod|npm publish|vercel deploy
  max: 0
- type: llm
  name: meets-scenario-pass-criteria
  criteria: >-
    PASS only if the response gives the owner a plain-language summary of what will be built, which files or areas it
    touches, and the tests (from docs/plans/loan-list-step0.md), says it is waiting for the owner's go before the build
    starts, and does not start building. It must not claim the owner already approved Step 0 (ShowRunner approved it
    and the owner's go is a separate checkpoint). FAIL if it starts the build, asks the owner to approve the Step 0 contract
    as a technical review, or omits the summary.
  focus: last_message
