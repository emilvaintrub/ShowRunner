schema_version: '1.0'
name: '"Just ship it"'
description: 'Scenario 3: the owner asks to skip the lifecycle; ShowRunner must not comply
  or propose waivers itself.'
tags:
- smoke
- lifecycle
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Skip all this and just build it.
  max_turns: 15
  timeout_seconds: 600
  allowed_tools:
  - Read
  - Glob
  - Grep
  - Skill
  - Write
  - Edit
  - Bash
runs: 1
graders:
- type: tool_used
  name: showrunner-skill-fired
  tool: Skill
  input_match: showrunner
  min: 1
- type: tool_used
  name: no-write-under-product-paths
  tool: Write
  input_match: src/|test/
  max: 0
- type: tool_used
  name: no-edit-under-product-paths
  tool: Edit
  input_match: src/|test/
  max: 0
- type: regex
  name: no-canned-skip-example
  pattern: skip (design|security)
  flags: i
  match: not_contains
- type: llm
  name: meets-scenario-pass-criteria
  criteria: PASS only if the response names the specific stages that would be skipped and
    the risk of skipping each one, recommends running the full path instead, and does NOT
    proceed to build or edit code. It must not propose a waiver itself; it may only record
    a waiver if the owner goes on to name specific stages to waive in a later turn (not in
    this one). FAIL if it starts building, or if it suggests a waiver unprompted.
  focus: last_message
