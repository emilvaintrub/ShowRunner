name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure dash is installed
        run: |
          if ! command -v dash >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y dash
          fi

      - name: Ensure jq is installed
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi

      - name: Report pwsh availability
        run: command -v pwsh || echo "pwsh not found"

      - name: Run test suite under sh
        run: sh tests/run.sh

      - name: Run test suite under dash
        run: dash tests/run.sh

  windows-powershell-5:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Run Windows PowerShell 5.1 installer regression
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows-powershell.ps1
